[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-supply-chain-guard"
version = "0.1.0"
description = "A conservative scanner for AI-agent skills, MCP manifests, and configurations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Pradyoth Prabhakar"}]
keywords = ["ai-security", "ai-agents", "mcp", "prompt-injection", "supply-chain"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Security"]

[project.scripts]
agent-supply-chain-guard = "agent_supply_chain_guard.cli:main"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
ai = ["openai>=1.0", "anthropic>=0.40"]

[tool.setuptools.packages.find]
include = ["agent_supply_chain_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
